[project]
name = "floodograph-pipeline"
version = "0.1.0"
description = "Floodograph veri hattı: DEM, HAND, gömülü dereler ve 2D sel modeli"
requires-python = ">=3.12"
dependencies = [
  "numpy",
  "scipy",
  "numba",
  "rasterio",
  "pyproj",
  "shapely",
  "geopandas",
  "pysheds",
  "osmnx",
  "requests",
  "pyyaml",
  "python-dotenv",
  "psycopg[binary]",
  "zstandard",
  "matplotlib",
]

[dependency-groups]
dev = ["pytest"]

[project.scripts]
floodograph = "floodograph.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["floodograph"]

[tool.pytest.ini_options]
testpaths = ["tests"]
